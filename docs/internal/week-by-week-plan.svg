  <text x="36" y="84" font-weight="600" fill="#1f1f1f">Build and pilot</text>
  <text x="36" y="102" font-size="11.5" fill="#6b6b6b">Weeks 9–10 · 16–24 Oct</text>
  <text x="36" y="126" font-size="11.5" fill="#1f1f1f">Questions, prompts, code,</text>
  <text x="36" y="142" font-size="11.5" fill="#1f1f1f">proposal submitted</text>

  <text x="216" y="84" font-weight="600" fill="#1f1f1f">Runs and marking</text>
  <text x="216" y="102" font-size="11.5" fill="#6b6b6b">Week 11 · 25–31 Oct</text>
