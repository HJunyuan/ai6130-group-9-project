  <text x="396" y="126" font-size="11.5" fill="#1f1f1f">Tests, error bars,</text>
  <text x="396" y="142" font-size="11.5" fill="#1f1f1f">charts, examples</text>

  <text x="576" y="84" font-weight="600" fill="#1f1f1f">Story and slides</text>
